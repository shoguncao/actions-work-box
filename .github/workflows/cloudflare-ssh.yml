name: cloudflare-ssh

run-name: cloudflare-ssh ${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      ssh_pubkey:
        required: true
        type: string
      correlation_id:
        required: false
        default: ''

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      statuses: write
    steps:
      - name: Start sshd + Cloudflare Quick Tunnel
        env:
          SSH_PUBKEY: ${{ inputs.ssh_pubkey }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          [ -n "$SSH_PUBKEY" ] || { echo "Error: ssh_pubkey is empty" >&2; exit 1; }
          printf '%s\n' "$SSH_PUBKEY" > authorized_keys
          chmod 600 authorized_keys
          sudo ssh-keygen -A
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -p 2222 \
            -o "AuthorizedKeysFile=$PWD/authorized_keys" \
            -o PasswordAuthentication=no -D &

          {
            echo 'deb [trusted=yes] https://pkg.cloudflare.com/cloudflared any main' | sudo tee /etc/apt/sources.list.d/cloudflared.list
            sudo apt-get update -qq
            sudo apt-get install -y cloudflared || { echo "cloudflared installation failed" >&2; exit 1; }
          }
          : > cloudflared.log
          tail -f cloudflared.log >&2 &
          cloudflared tunnel --no-autoupdate --url tcp://localhost:2222 >> cloudflared.log 2>&1 &
          cf_pid=$!

          url=""
          for i in $(seq 1 60); do
            url=$(grep -oE 'https://[a-zA-Z0-9]+(-[a-zA-Z0-9]+)+\.trycloudflare\.com' cloudflared.log | head -1 || true)
            [ -n "$url" ] && break
            if ! kill -0 "$cf_pid"; then
              echo "cloudflared 已退出且未拿到隧道地址" >&2
              cat cloudflared.log >&2
              exit 1
            fi
            sleep 1
          done
          [ -n "$url" ] || { echo "60s 内未读到 Quick Tunnel 域名" >&2; cat cloudflared.log >&2; exit 1; }

          echo "Tunnel URL: $url"
          if [ -n "$CORRELATION_ID" ]; then
            payload=$(python3 -c 'import json,sys; print(json.dumps({"state":"success","context":"cloudflare-ssh/"+sys.argv[1],"description":sys.argv[2]}))' "$CORRELATION_ID" "$url")
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -d "$payload"
          fi
          echo "Install cloudflared locally, then replace the private key path in this command:"
          echo "ssh -i /path/to/action-sshd-cloudflared -o ProxyCommand='cloudflared access tcp --hostname $url' -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null runner@github-actions"
          echo "Finish (green): run pkill -x cloudflared in the SSH session; the connection drops immediately"
          echo "Finish (gray): Cancel workflow from the Actions page"
          wait "$cf_pid" || true
